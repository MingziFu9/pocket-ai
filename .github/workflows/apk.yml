name: 打包安卓 APK
# 手动运行，或每周一北京时间 04:00 自动出一次包（内容每天同步，APK 每周更新一次）
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt

      - name: 构建课程内容（APP 内站点根路径为 /）
        run: python scripts/build.py --base / --out dist

      - name: 断网自检：全部动画、题目页、“试一试”
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 8766 --directory dist >/dev/null 2>&1 &
          sleep 2
          node scripts/offline-check.js dist http://localhost:8766/

      - name: 生成安卓工程
        working-directory: apk
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: 签名并打包
        working-directory: apk/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "缺少签名密钥：请先在仓库 Settings → Secrets 里配置 ANDROID_KEYSTORE_BASE64 等 4 项"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/pocket-ai-$APP_VERSION_NAME.apk"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.APP_VERSION_NAME }}
          name: 口袋 AI 课 ${{ env.APP_VERSION_NAME }}
          files: out/*.apk
          make_latest: true
          body: |
            口袋 AI 课安卓版，17 门开源课程全部内置，安装后可断网学习。

            - 适用：Android 7.0 及以上
            - 安装：下载下面的 apk 文件，打开安装；如提示“未知来源”，按提示允许本次安装即可
            - 已有旧版的直接覆盖安装，阅读记录会保留
            - 出包前已在断网状态下自动检查全部交互动画、题目和“试一试”
